
name: Build Aura Cycle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify Node
        run: |
          node --version
          npm --version
          echo "$RUNNER_TEMP"
          which node

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Verify Capacitor CLI
        run: |
          node --version
          npm ls @capacitor/cli
          ./node_modules/.bin/cap --version

      - name: Sync Capacitor
        run: ./node_modules/.bin/cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Cycle-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
